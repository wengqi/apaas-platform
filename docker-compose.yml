# ============================================================
# aPaaS 全量 Docker 部署
# 用法: docker compose up -d --build
# ============================================================

services:
  # ---------- 基础设施 ----------
  postgres:
    image: postgres:16-alpine
    container_name: apaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apaas
      # 评审 M-7：口令走环境变量（生产必须覆盖），不再硬编码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: apaas
      TZ: Asia/Shanghai
    # 评审 M-7：仅在宿主机回环监听，避免数据库/缓存暴露到网络
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - apaas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apaas -d apaas']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: apaas-redis
    restart: unless-stopped
    # 评审 M-7：可选口令（设置 REDIS_PASSWORD 时必须同步调整 REDIS_URL）
    command:
      - sh
      - -c
      - 'redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$${REDIS_PASSWORD}"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - apaas_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------- 后端 API 网关 ----------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: apaas-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://apaas:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/apaas?schema=public
      # 注意：容器内地址必须走 compose 网络（不能用宿主 .env 的 localhost）
      # 若启用 REDIS_PASSWORD，请改为 redis://:<PASSWORD>@redis:6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置强随机 JWT_SECRET（评审 C-1）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GATEWAY_PORT: '3000'
      CORS_ORIGINS: 'http://localhost:8080,http://localhost:8081'
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?请在 .env 中设置 64 位十六进制 CONNECTOR_ENCRYPTION_KEY（评审 C-1）}
      # 限流阈值可调（E2E/压测放宽；生产保持默认 100/10）
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_DEFAULT_LIMIT: ${THROTTLE_DEFAULT_LIMIT:-100}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-10}
      # 出站 SSRF 防护参数（生产禁止放开私网）
      OUTBOUND_HTTP_TIMEOUT_MS: ${OUTBOUND_HTTP_TIMEOUT_MS:-10000}
      OUTBOUND_ALLOW_PRIVATE: ${OUTBOUND_ALLOW_PRIVATE:-false}
      CLOUD_FUNCTION_MAX_CONCURRENT: ${CLOUD_FUNCTION_MAX_CONCURRENT:-4}
      CLOUD_FUNCTION_MEMORY_LIMIT_MB: ${CLOUD_FUNCTION_MEMORY_LIMIT_MB:-128}
      CLOUD_FUNCTION_TIMEOUT_MS: ${CLOUD_FUNCTION_TIMEOUT_MS:-5000}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 前端：Studio 搭建器 ----------
  studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: studio
    container_name: apaas-studio
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - gateway

  # ---------- 前端：Runtime UI 运行时 ----------
  runtime-ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-ui
    container_name: apaas-runtime-ui
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      - gateway

volumes:
  apaas_pg_data:
    name: apaas_pg_data
  apaas_redis_data:
    name: apaas_redis_data
