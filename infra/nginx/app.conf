server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 评审 M-3：CSP 纵深防御。低代码页面/流程支持自定义脚本（run_script），
    # token 存于 localStorage —— 一旦出现意外内联脚本即可能被窃取。
    # 这里禁止内联 script/外部 script，仅允许同源资源与同源 API；
    # style 需保留 unsafe-inline（AntD 运行时注入样式）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA 路由 fallback（React Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # iframe 嵌入干净页面（/embed/...）——仅此路由放宽 frame-ancestors 供宿主系统集成。
    # 主应用路由维持 'self' 不放松。部署时把下方 CSP 里的 frame-ancestors 值改为
    # 宿主 origin 白名单（空格分隔、含协议、单行），例如：
    #   ...; frame-ancestors 'self' https://host-a.example.com https://host-b.example.com; ...
    # 白名单须与 runtime-ui 的 VITE_EMBED_ALLOWED_ORIGINS 一致（协议入站校验用）。
    # 注意：nginx 的 add_header 不跨层继承——本 location 内的 header 必须完整重复。
    location /embed/ {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API 反向代理 → Gateway
    # 前端请求 /api/xxx，后端 URI 版本控制路由为 /api/v1/xxx
    # /api/docs（Swagger）和 /api/v1/（已含版本）不重写
    location /api/v1/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/docs {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
